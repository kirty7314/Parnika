<!DOCTYPE html>
<html>
<head>
<title>For My Bhondu 💖</title>

<style>
body{

text-align:center;
}

h1{
margin-top:120px;
color:#c2185b;
font-size:3em;
text-shadow:0 0 20px #ff80ab;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

button{
padding:18px 50px;
font-size:24px;
border:none;
border-radius:50px;
cursor:pointer;
position:absolute;
box-shadow:0 0 20px rgba(255,0,100,.6);
}

#yes{
background:#ff4081;
color:white;
left:35%;
top:350px;
}

#no{
background:#555;
color:white;
left:55%;
top:350px;
}

.heart{
position:absolute;
font-size:22px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{top:100%;opacity:1;}
100%{top:-10%;opacity:0;}
}
</style>
</head>
